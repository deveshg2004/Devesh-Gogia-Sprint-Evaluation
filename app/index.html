<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IT Asset Lifecycle Manager">
    <title>IT Asset Lifecycle Manager</title>

    <style>
        :root {
            --bg: #f3f5f8;
            --surface: #ffffff;
            --ink: #172033;
            --muted: #5b6678;
            --line: #d8dee8;
            --primary: #0a5bc4;
            --primary-dark: #084a9f;
            --success: #17794a;
            --danger: #b42318;
            --danger-bg: #fdf0ee;
            --locked-bg: #f7f8fa;
            --locked-ink: #8591a3;

            --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }

        :focus-visible {
            outline: 3px solid #7fb0f0;
            outline-offset: 2px;
        }

        /* HEADER */

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .topbar-inner {
            width: min(1080px, calc(100% - 48px));
            margin: 0 auto;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 700;
            flex: none;
        }

        .signed-in {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--muted);
            white-space: nowrap;
        }

        .signed-in[hidden] { display: none; }

        .signed-in strong {
            padding: 4px 12px;
            border: 1px solid #c4d6f0;
            border-radius: 999px;
            background: #eaf2fd;
            color: #0b4a9f;
            font-weight: 600;
        }

        /* MAIN */

        main {
            flex: 1;
            width: min(1080px, calc(100% - 48px));
            margin: 0 auto;
            padding: 48px 0 56px;
        }

        .intro { margin-bottom: 32px; }

        .intro h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .intro p {
            margin-top: 6px;
            font-size: 16px;
            color: var(--muted);
        }

        /* CARDS */

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .notice {
            grid-column: 1 / -1;
            padding: 14px 18px;
            border: 1px solid #f2c4be;
            border-left: 4px solid var(--danger);
            border-radius: 6px;
            background: var(--danger-bg);
            color: var(--danger);
            font-weight: 600;
            font-size: 15px;
        }

        .notice[hidden] { display: none; }

        .card {
            --accent: var(--primary);
            --accent-dark: #084a9f;
            --accent-tint: #eaf2fd;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--line);
            border-top: 4px solid var(--accent);
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 1px 3px rgba(23, 32, 51, 0.06);
        }

        .card[data-role="Admin"] {
            --accent: #0a5bc4;
            --accent-dark: #084a9f;
            --accent-tint: #eaf2fd;
        }

        .card[data-role="Manager"] {
            --accent: #0f8a78;
            --accent-dark: #0b6e60;
            --accent-tint: #e5f5f2;
        }

        .card[data-role="Employee"] {
            --accent: #d98a0b;
            --accent-dark: #b36500;
            --accent-tint: #fdf2de;
        }

        .card.locked {
            background: var(--locked-bg);
            border-top-color: #c5ccd8;
            box-shadow: none;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--accent-tint);
            color: var(--accent-dark);
            flex: none;
        }

        .card-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-role {
            padding: 3px 10px;
            border-radius: 4px;
            background: var(--accent-tint);
            color: var(--accent-dark);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .card.locked .card-icon,
        .card.locked .card-role {
            background: #eceff4;
            color: var(--locked-ink);
        }

        .card h2 {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .card.locked h2 { color: #6b768a; }

        .status {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--success);
        }

        .card.locked .status { color: var(--locked-ink); }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--accent-dark);
            border-radius: 6px;
            background: var(--accent-dark);
            color: #fff;
            font: 600 15px var(--font);
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover { filter: brightness(1.1); }

        .card.locked .btn {
            background: transparent;
            border: 1px solid #c5ccd8;
            color: #6b768a;
        }

        .card.locked .btn:hover { background: #eceff4; filter: none; }

        /* STATES */

        .state {
            grid-column: 1 / -1;
            max-width: 640px;
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--muted);
            font-size: 15px;
        }

        .state strong {
            display: block;
            margin-bottom: 4px;
            font-size: 18px;
            color: var(--ink);
        }

        .state.error {
            border-color: #f2c4be;
            background: var(--danger-bg);
            color: var(--danger);
        }

        .state.error strong { color: var(--danger); }

        /* FOOTER */

        footer {
            border-top: 1px solid var(--line);
            background: var(--surface);
        }

        .footer-inner {
            width: min(1080px, calc(100% - 48px));
            margin: 0 auto;
            padding: 18px 0;
            font-size: 13px;
            color: var(--muted);
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 560px) {
            .topbar-inner, main, .footer-inner { width: calc(100% - 32px); }
            .signed-in span { display: none; }
            main { padding-top: 32px; }
            .intro h1 { font-size: 26px; }
            .card { padding: 22px; }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">IT</div>
                IT Asset Lifecycle Manager
            </div>
            <div id="signedIn" class="signed-in" hidden>
                <span>Signed in as</span>
                <strong id="roleBadge"></strong>
            </div>
        </div>
    </header>

    <main>
        <section class="intro">
            <h1 id="welcomeTitle">Checking access</h1>
            <p id="welcomeSubtitle">Confirming which dashboards your account can open.</p>
        </section>

        <section id="dashboardArea" class="grid" aria-live="polite"></section>
    </main>

    <footer>
        <div class="footer-inner">IT Asset Lifecycle Manager</div>
    </footer>

    <script>
        const dashboards = [
            {
                role: 'Admin',
                title: 'Admin Dashboard',
                href: '/asset.lifecycle.dashboardui/index.html'
            },
            {
                role: 'Manager',
                title: 'Manager Dashboard',
                href: '/asset.lifecycle.managerdashboardui/index.html'
            },
            {
                role: 'Employee',
                title: 'Employee Dashboard',
                href: '/asset.lifecycle.employeedashboardui/index.html'
            }
        ];

        /* Static, trusted SVG markup (no user input) */
        const icons = {
            Admin:
                '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>',
            Manager:
                '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4.5 2 4.5 4.5"/></svg>',
            Employee:
                '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/></svg>'
        };

        const area = document.getElementById('dashboardArea');
        const welcomeTitle = document.getElementById('welcomeTitle');
        const welcomeSubtitle = document.getElementById('welcomeSubtitle');
        const roleBadge = document.getElementById('roleBadge');
        const signedIn = document.getElementById('signedIn');

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function showState(title, message, isError) {
            area.replaceChildren();
            const box = el('div', 'state' + (isError ? ' error' : ''));
            box.appendChild(el('strong', '', title));
            box.appendChild(document.createTextNode(message));
            area.appendChild(box);
        }

        function showAccessDenied(dashboardTitle) {
            const notice = document.getElementById('accessNotice');
            if (!notice) return;
            notice.textContent =
                `Access denied: your current role does not have permission to open the ${dashboardTitle}.`;
            notice.hidden = false;
            notice.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function buildCard(dashboard, currentRole) {
            const allowed = currentRole === 'Admin' || dashboard.role === currentRole;

            const card = el('article', 'card ' + (allowed ? 'available' : 'locked'));
            card.dataset.role = dashboard.role;

            const head = el('div', 'card-head');
            const icon = el('div', 'card-icon');
            icon.innerHTML = icons[dashboard.role];
            head.appendChild(icon);
            head.appendChild(el('span', 'card-role', dashboard.role.toUpperCase()));
            card.appendChild(head);
            card.appendChild(el('h2', '', dashboard.title));

            card.appendChild(el('div', 'status',
                !allowed ? 'Access restricted for your role'
                : currentRole === 'Admin' ? (dashboard.role === 'Admin' ? 'Your dashboard' : 'Available')
                : 'Assigned to your role'
            ));

            if (allowed) {
                const link = el('a', 'btn', 'Open dashboard');
                link.href = dashboard.href;
                card.appendChild(link);
            } else {
                const button = el('button', 'btn', 'Access restricted');
                button.type = 'button';
                button.setAttribute('aria-label', 'Access restricted to ' + dashboard.title);
                button.addEventListener('click', () => showAccessDenied(dashboard.title));
                card.appendChild(button);
            }

            return card;
        }

        function renderDashboards(currentRole) {
            area.replaceChildren();

            const notice = el('div', 'notice');
            notice.id = 'accessNotice';
            notice.setAttribute('role', 'alert');
            notice.hidden = true;
            area.appendChild(notice);

            dashboards.forEach(d => area.appendChild(buildCard(d, currentRole)));
        }

        async function loadLandingPage() {
            showState('Checking your access', 'This only takes a moment.', false);

            try {
                const response = await fetch('/odata/v4/asset-lifecycle/getCurrentUserContext()', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`Unable to determine your role (${response.status}).`);
                }

                const context = await response.json();
                const role = context.role;

                if (!dashboards.some(d => d.role === role)) {
                    welcomeTitle.textContent = 'No role assigned';
                    welcomeSubtitle.textContent = 'Your account does not have an application role yet.';
                    showState(
                        'Ask your administrator for access',
                        'Request an Admin, Manager or Employee role, then refresh this page.',
                        false
                    );
                    return;
                }

                welcomeTitle.textContent = `Welcome, ${role}`;
                welcomeSubtitle.textContent = role === 'Admin'
                    ? 'You have access to all three dashboards.'
                    : 'Open your dashboard to continue.';

                roleBadge.textContent = role;
                signedIn.hidden = false;

                renderDashboards(role);

            } catch (error) {
                console.error(error);
                welcomeTitle.textContent = 'Workspace unavailable';
                welcomeSubtitle.textContent = 'Refresh the page. If the problem continues, contact your administrator.';
                showState('Could not load your access', error.message, true);
            }
        }

        loadLandingPage();
    </script>

</body>
</html>
