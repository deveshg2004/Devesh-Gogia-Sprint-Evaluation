<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IT Asset Lifecycle Manager">
    <title>IT Asset Lifecycle Manager</title>

    <style>
        :root {
            --primary: #0a6ed1;
            --primary-dark: #0854a0;
            --text: #172b4d;
            --muted: #667085;
            --surface: #ffffff;
            --background: #f4f7fb;
            --border: #e4e7ec;
            --success: #107e3e;
            --locked: #98a2b3;
            --danger: #b42318;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5fc 0%, var(--background) 55%, #ffffff 100%);
            color: var(--text);
        }

        .header {
            background: linear-gradient(135deg, #075aab, var(--primary));
            color: white;
            padding: 42px 24px 38px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(10, 110, 209, 0.18);
        }

        .header h1 {
            font-size: clamp(28px, 4vw, 40px);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .content {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
            padding: 42px 0 60px;
        }

        .welcome {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .welcome h2 {
            font-size: 26px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: var(--muted);
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            padding: 9px 14px;
            border-radius: 999px;
            background: #e8f2fc;
            color: var(--primary-dark);
            font-weight: 700;
            white-space: nowrap;
        }

        .dashboard-area {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(16, 24, 40, 0.07);
            padding: 28px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card.available {
            border-color: #b8d8f6;
        }

        .card.available:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(16, 24, 40, 0.11);
        }

        .card.locked {
            background: #f8fafc;
            box-shadow: none;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: #e8f2fc;
            color: var(--primary);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .card.locked .card-icon {
            background: #eaecf0;
            color: var(--locked);
        }

        .card h3 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--muted);
            line-height: 1.6;
            min-height: 76px;
            margin-bottom: 22px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 700;
        }

        .status.allowed {
            color: var(--success);
        }

        .status.locked {
            color: var(--locked);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn.disabled {
            background: #e4e7ec;
            color: #667085;
            cursor: not-allowed;
        }

        .access-message {
            display: none;
            grid-column: 1 / -1;
            padding: 14px 18px;
            border: 1px solid #fecdca;
            border-radius: 10px;
            background: #fff5f4;
            color: var(--danger);
            font-weight: 600;
            text-align: center;
        }

        .loading,
        .error,
        .no-access {
            grid-column: 1 / -1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            color: var(--muted);
            box-shadow: 0 8px 28px rgba(16, 24, 40, 0.06);
        }

        .error {
            color: var(--danger);
            border-color: #fecdca;
            background: #fff5f4;
        }

        .footer {
            text-align: center;
            color: #98a2b3;
            font-size: 13px;
            margin-top: 42px;
        }

        @media (max-width: 640px) {
            .content {
                width: min(100% - 28px, 1080px);
                padding-top: 28px;
            }

            .welcome {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>IT Asset Lifecycle Manager</h1>
    </header>

    <main class="content">
        <section class="welcome">
            <div>
                <h2 id="welcomeTitle">Welcome</h2>
                <p id="welcomeSubtitle">Choose a dashboard to continue.</p>
            </div>
            <div id="roleBadge" class="role-badge" hidden></div>
        </section>

        <section id="dashboardArea" class="dashboard-area" aria-live="polite">
            <div class="loading">Checking your access...</div>
        </section>

        <div class="footer">IT Asset Lifecycle Manager</div>
    </main>

    <script>
        const dashboards = [
            {
                role: 'Admin',
                icon: 'A',
                title: 'Admin Dashboard',
                description: 'Manage assets, departments, archive records, ownership and administrative activities.',
                href: '/asset.lifecycle.dashboardui/index.html'
            },
            {
                role: 'Manager',
                icon: 'M',
                title: 'Manager Dashboard',
                description: 'Manage employees, asset assignments, maintenance records and operational requests.',
                href: '/asset.lifecycle.managerdashboardui/index.html'
            },
            {
                role: 'Employee',
                icon: 'E',
                title: 'Employee Dashboard',
                description: 'View your assigned assets, maintenance history and asset requests.',
                href: '/asset.lifecycle.employeedashboardui/index.html'
            }
        ];

        function showAccessDenied(dashboardTitle) {
            const message = document.getElementById('accessMessage');
            message.textContent = `Access denied: your current role does not have permission to open the ${dashboardTitle}.`;
            message.style.display = 'block';
            window.scrollTo({ top: message.offsetTop - 20, behavior: 'smooth' });
        }

        function renderDashboards(currentRole) {
            const dashboardArea = document.getElementById('dashboardArea');

            dashboardArea.innerHTML = `
                <div id="accessMessage" class="access-message" role="alert"></div>
                ${dashboards.map((dashboard) => {
                    const allowed = currentRole === 'Admin' || dashboard.role === currentRole;
                    const statusText = allowed
                        ? (currentRole === 'Admin' && dashboard.role !== 'Admin' ? '✓ Admin access' : '✓ Your dashboard')
                        : '🔒 Restricted for your role';

                    return `
                        <article class="card ${allowed ? 'available' : 'locked'}">
                            <div class="card-icon" aria-hidden="true">${dashboard.icon}</div>
                            <h3>${dashboard.title}</h3>
                            <p>${dashboard.description}</p>
                            <div class="status ${allowed ? 'allowed' : 'locked'}">${statusText}</div>
                            ${allowed
                                ? `<a class="btn" href="${dashboard.href}">Open Dashboard</a>`
                                : `<button class="btn disabled" type="button" onclick="showAccessDenied('${dashboard.title}')" aria-label="Access restricted to ${dashboard.title}">Access Restricted</button>`
                            }
                        </article>
                    `;
                }).join('')}
            `;
        }

        async function loadLandingPage() {
            const dashboardArea = document.getElementById('dashboardArea');
            const welcomeTitle = document.getElementById('welcomeTitle');
            const welcomeSubtitle = document.getElementById('welcomeSubtitle');
            const roleBadge = document.getElementById('roleBadge');

            try {
                const response = await fetch('/odata/v4/asset-lifecycle/getCurrentUserContext()', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`Unable to determine your role (${response.status}).`);
                }

                const context = await response.json();
                const role = context.role;

                if (!dashboards.some((dashboard) => dashboard.role === role)) {
                    welcomeTitle.textContent = 'Access not configured';
                    welcomeSubtitle.textContent = 'Your account does not have an application role assigned.';
                    dashboardArea.innerHTML = '<div class="no-access">Please contact your administrator to request an Admin, Manager or Employee role.</div>';
                    return;
                }

                welcomeTitle.textContent = `Welcome, ${role}`;
                welcomeSubtitle.textContent = 'All three dashboards are visible. Your role determines which dashboards you can open.';
                roleBadge.textContent = `${role} access`;
                roleBadge.hidden = false;

                renderDashboards(role);
            } catch (error) {
                console.error(error);
                welcomeTitle.textContent = 'Unable to load your workspace';
                welcomeSubtitle.textContent = 'Please refresh the page or contact your administrator if the problem continues.';
                dashboardArea.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        loadLandingPage();
    </script>
</body>
</html>
