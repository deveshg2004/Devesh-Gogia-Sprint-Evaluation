_schema-version: 3.3.0
ID: it-asset-lifecycle-manager
version: 1.0.0
description: "Welcome to your new CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npm run build:apps # UI5 apps + launcher next to the CAP server (gen/srv/app)

modules:
  - name: it-asset-lifecycle-manager-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: it-asset-lifecycle-manager-auth
      - name: it-asset-lifecycle-manager-db

  - name: it-asset-lifecycle-manager-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      buildpack: nodejs_buildpack
    requires:
      - name: it-asset-lifecycle-manager-db

  - name: it-asset-lifecycle-manager
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: it-asset-lifecycle-manager-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: it-asset-lifecycle-manager-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: it-asset-lifecycle-manager-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Admin (it-asset-lifecycle-manager ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Admin'

          - name: 'Manager (it-asset-lifecycle-manager ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Manager'

          - name: 'Employee (it-asset-lifecycle-manager ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Employee'

    requires:
      - name: app-api

  - name: it-asset-lifecycle-manager-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared